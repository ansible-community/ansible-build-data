name: nox
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run once per week (Thursday at 04:15 UTC)
  schedule:
    - cron: '15 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  nox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible-build-data
    strategy:
      fail-fast: false
      matrix:
        include:
          - session: lint
            python-versions: "3.14"
          - session: zizmor
            python-versions: "3.14"
    name: "Run nox ${{ matrix.session }} session"
    steps:
      - name: Check out ansible-build-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ansible-build-data
          persist-credentials: false
      - name: Setup nox
        uses: wntrblm/nox@57f9e10c4eef84277dcd692d0056420c947674f9  # 2026.08.10
        with:
          python-versions: "${{ matrix.python-versions }}"
      - name: Set up nox environments
        run: |
          nox -v -e "${{ matrix.session }}" --install-only
      - name: "Run nox -e ${{ matrix.session }}"
        run: |
          nox -v -e "${{ matrix.session }}" --reuse-existing-virtualenvs --no-install
